name: "Node.js Web API"
type: "node-web"
description: "Express.js web service with TypeScript"

directories:
  - "src"
  - "src/routes"
  - "tests"
  - ".github/workflows"

files:
  - path: "README.md"
    content: |
      # {{project_name}}

      {{description}}

      ## Installation

      ```bash
      npm install
      ```

      ## Usage

      ```bash
      npm run dev  # Development
      npm start    # Production
      npm test     # Run tests
      ```

      ## License

      {{license}}

  - path: "package.json"
    content: |
      {
        "name": "{{project_name}}",
        "version": "0.1.0",
        "description": "{{description}}",
        "main": "dist/index.js",
        "scripts": {
          "dev": "ts-node-dev --respawn src/index.ts",
          "build": "tsc",
          "start": "node dist/index.js",
          "test": "jest"
        },
        "dependencies": {
          "express": "^4.18.0"
        },
        "devDependencies": {
          "@types/express": "^4.17.0",
          "@types/node": "^20.0.0",
          "typescript": "^5.3.0",
          "ts-node-dev": "^2.0.0",
          "jest": "^29.0.0"
        }
      }

  - path: ".gitignore"
    template: "node/.gitignore"

  - path: "LICENSE"
    template: "base/LICENSE.{{license}}"

  - path: "src/index.ts"
    content: |
      import express from 'express';

      const app = express();
      const port = process.env.PORT || 3000;

      app.use(express.json());

      app.get('/', (req, res) => {
        res.json({ message: 'Hello from {{project_name}}!' });
      });

      app.listen(port, () => {
        console.log(`Server running on port ${port}`);
      });

  - path: "tsconfig.json"
    content: |
      {
        "compilerOptions": {
          "target": "ES2020",
          "module": "commonjs",
          "lib": ["ES2020"],
          "outDir": "./dist",
          "rootDir": "./src",
          "strict": true,
          "esModuleInterop": true,
          "skipLibCheck": true,
          "forceConsistentCasingInFileNames": true
        },
        "include": ["src/**/*"],
        "exclude": ["node_modules", "dist"]
      }

next_steps:
  - "cd {{project_name}}"
  - "npm install"
  - "npm run dev"
  - "# API at: http://localhost:3000"
